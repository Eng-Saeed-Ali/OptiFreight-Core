<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-labelledby="t d">
  <title id="t">Semi-trailer lever-arm axle model, LIFO diminishing-load trap and persistent RouteStep history</title>
  <desc id="d">A 13,600 mm trailer with kingpin at 1,600 mm and tri-axle bogie at 10,300 mm. With 16 t in front and 8 t behind the bogie the tractor drive axle carries 10,786 kg (pass). After the rear 8 t is popped first under LIFO, the drive axle carries 11,567 kg, above the 11,500 kg limit (fail). Right panel: RouteStep.prev parent pointers share history across branches at O(1) cost.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#475569" stroke-width="2"/>
    </pattern>
    <marker id="down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,0 L5,10 z" fill="#e2e8f0"/>
    </marker>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a5b4fc"/>
    </marker>
    <style>
      .title { font: 800 18px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; fill: #f8fafc; }
      .sub { font: 400 12px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; fill: #94a3b8; }
      .h { font: 700 12px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; letter-spacing: 1px; fill: #cbd5e1; }
      .cargo { font: 700 12px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; fill: #f8fafc; }
      .small { font: 400 10.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; fill: #94a3b8; }
      .mono { font: 500 10.5px 'JetBrains Mono',Consolas,'Courier New',monospace; fill: #e2e8f0; }
      .monos { font: 500 9.5px 'JetBrains Mono',Consolas,'Courier New',monospace; fill: #cbd5e1; }
      .pass { font: 800 13px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; fill: #34d399; }
      .fail { font: 800 13px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; fill: #f87171; }
    </style>
  </defs>

  <rect width="1100" height="440" rx="18" fill="url(#bg)"/>
  <text x="30" y="34" class="title">F5 + EC-B · Lever-Arm Axle Physics &amp; the LIFO Diminishing-Load Trap</text>
  <text x="30" y="54" class="sub">Doubled-coordinate integer lever rule — every push AND every pop is re-checked against the 11 500 kg drive-axle ceiling.</text>

  <!-- ============ ROW A : full load ============ -->
  <text x="60" y="82" class="h">① BOTH LOADS ON BOARD  ·  24 000 kg  ·  13 600 mm</text>
  <!-- trailer outline -->
  <rect x="60" y="92" width="800" height="46" rx="4" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="60.75" y="92.75" width="528.6" height="44.5" fill="#4f46e5" fill-opacity="0.85"/>
  <text x="324.7" y="120" text-anchor="middle" class="cargo">FRONT · 16 000 kg · 0–9 000 mm</text>
  <rect x="589.4" y="92.75" width="269.85" height="44.5" fill="#d97706" fill-opacity="0.9"/>
  <text x="724.7" y="120" text-anchor="middle" class="cargo">REAR · 8 000 kg</text>
  <!-- nose / door -->
  <text x="54" y="120" text-anchor="end" class="small">NOSE</text>
  <text x="866" y="120" class="small">DOOR</text>
  <!-- chassis + kingpin + bogie -->
  <line x1="60" y1="140" x2="860" y2="140" stroke="#94a3b8" stroke-width="3"/>
  <path d="M154,141 L146,156 L162,156 z" fill="#fbbf24"/>
  <circle cx="640" cy="150" r="9" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="666" cy="150" r="9" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="692" cy="150" r="9" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
  <text x="170" y="172" class="mono">kingpin → 850‰ to drive axle</text>
  <text x="560" y="178" class="small">rear CoM at 11 300 mm sits BEHIND the bogie → lifts the kingpin</text>
  <text x="60" y="196" class="pass">✓ Drive axle 10 786 kg ≤ 11 500 kg — PASS</text>

  <!-- ============ ROW B : rear popped ============ -->
  <text x="60" y="232" class="h">② AFTER LIFO POP OF THE REAR LOAD  ·  16 000 kg remain</text>
  <rect x="60" y="242" width="800" height="46" rx="4" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="60.75" y="242.75" width="528.6" height="44.5" fill="#4f46e5" fill-opacity="0.85"/>
  <text x="324.7" y="270" text-anchor="middle" class="cargo">FRONT · 16 000 kg · 0–9 000 mm</text>
  <rect x="589.4" y="242.75" width="269.85" height="44.5" fill="url(#hatch)" opacity="0.6"/>
  <text x="724.7" y="270" text-anchor="middle" class="cargo" fill="#94a3b8" style="fill:#94a3b8">counterweight gone</text>
  <text x="54" y="270" text-anchor="end" class="small">NOSE</text>
  <text x="866" y="270" class="small">DOOR</text>
  <line x1="60" y1="290" x2="860" y2="290" stroke="#94a3b8" stroke-width="3"/>
  <path d="M154,291 L146,306 L162,306 z" fill="#f87171"/>
  <circle cx="640" cy="300" r="9" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="666" cy="300" r="9" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="692" cy="300" r="9" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
  <text x="170" y="322" class="mono">centre of mass shifts forward onto the kingpin</text>
  <text x="60" y="346" class="fail">✗ Drive axle 11 567 kg &gt; 11 500 kg — FAIL (legal at full load, illegal half-way)</text>

  <!-- ============ RULER ============ -->
  <line x1="60" y1="366" x2="860" y2="366" stroke="#475569" stroke-width="1"/>
  <g class="monos">
    <line x1="60" y1="361" x2="60" y2="371" stroke="#94a3b8"/><text x="60" y="384" text-anchor="middle">0</text>
    <line x1="154.1" y1="361" x2="154.1" y2="371" stroke="#fbbf24"/><text x="154.1" y="384" text-anchor="middle" style="fill:#fbbf24">kingpin 1 600</text>
    <line x1="589.4" y1="361" x2="589.4" y2="371" stroke="#94a3b8"/><text x="575" y="384" text-anchor="end">9 000</text>
    <line x1="665.9" y1="361" x2="665.9" y2="371" stroke="#cbd5e1"/><text x="665.9" y="384" text-anchor="middle">bogie 10 300</text>
    <line x1="860" y1="361" x2="860" y2="371" stroke="#94a3b8"/><text x="860" y="384" text-anchor="middle">13 600 mm</text>
  </g>

  <!-- ============ FORMULA ============ -->
  <rect x="60" y="396" width="800" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="72" y="416" class="monos">moment = Σ wᵢ·(2·10 300 − X2ᵢ)   kingpin = 2 000 + ⌈max(moment,0) / 17 400⌉   drive = 800 + ⌈kingpin·850 / 1000⌉</text>

  <!-- ============ RIGHT PANEL : RouteStep.prev ============ -->
  <rect x="890" y="70" width="190" height="358" rx="14" fill="#6366f1" fill-opacity="0.07" stroke="#818cf8" stroke-opacity="0.6"/>
  <text x="985" y="92" text-anchor="middle" class="h" style="fill:#a5b4fc">EC-F · RouteStep.prev</text>
  <text x="985" y="108" text-anchor="middle" class="small">persistent parent-pointer list</text>

  <rect x="925" y="122" width="120" height="34" rx="8" fill="#1e293b" stroke="#818cf8"/>
  <text x="985" y="137" text-anchor="middle" class="monos">S1 PICKUP B</text>
  <text x="985" y="150" text-anchor="middle" class="monos" style="fill:#64748b">prev = None</text>

  <rect x="925" y="184" width="120" height="34" rx="8" fill="#1e293b" stroke="#818cf8"/>
  <text x="985" y="199" text-anchor="middle" class="monos">S2 PICKUP A</text>
  <text x="985" y="212" text-anchor="middle" class="monos" style="fill:#64748b">prev → S1</text>
  <line x1="985" y1="183" x2="985" y2="158" stroke="#a5b4fc" stroke-width="1.6" marker-end="url(#up)"/>

  <rect x="898" y="252" width="84" height="34" rx="8" fill="#1e293b" stroke="#34d399"/>
  <text x="940" y="267" text-anchor="middle" class="monos">S3 DELIVER A</text>
  <text x="940" y="280" text-anchor="middle" class="monos" style="fill:#64748b">prev → S2</text>
  <rect x="988" y="252" width="84" height="34" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="1030" y="267" text-anchor="middle" class="monos">S3′ PICKUP C</text>
  <text x="1030" y="280" text-anchor="middle" class="monos" style="fill:#64748b">prev → S2</text>
  <line x1="945" y1="251" x2="972" y2="220" stroke="#a5b4fc" stroke-width="1.6" marker-end="url(#up)"/>
  <line x1="1025" y1="251" x2="998" y2="220" stroke="#a5b4fc" stroke-width="1.6" marker-end="url(#up)"/>

  <text x="985" y="310" text-anchor="middle" class="small">branching allocates ONE node</text>
  <text x="985" y="326" text-anchor="middle" class="small">shared prefix is never copied</text>
  <text x="985" y="348" text-anchor="middle" class="mono" style="fill:#a5b4fc">O(1) per expansion</text>
  <text x="985" y="372" text-anchor="middle" class="small">compare=False, repr=False (A6)</text>
  <text x="985" y="388" text-anchor="middle" class="small">→ no recursion blow-up on</text>
  <text x="985" y="404" text-anchor="middle" class="small">1 500-deep chains</text>
</svg>

