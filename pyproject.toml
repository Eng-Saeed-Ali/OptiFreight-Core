[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optifreight-core"
version = "1.0.0"
description = "Deterministic Zero-Float Multi-Stop LTL Freight Dispatcher & Route Optimizer in Pure Python"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Saeed Ali", url = "https://github.com/Eng-Saeed-Ali" },
]
keywords = [
    "logistics",
    "ltl-optimization",
    "branch-and-bound",
    "fixed-point-arithmetic",
    "tachograph-561-2006",
    "axle-load-physics",
    "deterministic-systems",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
optifreight = "optifreight.cli_visualizer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
